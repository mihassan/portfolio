{{ define "main" }}
<section class="creative-page shell">
  <nav class="breadcrumb" aria-label="Breadcrumb"><a href="{{ "/" | relURL }}">Home</a><span aria-hidden="true">/</span><span aria-current="page">Creative</span></nav>
  <header class="page-hero page-hero--split">
    <div><p class="eyebrow">{{ .Params.eyebrow }}</p><h1>{{ .Params.heading | default .Title }}</h1><p class="page-hero__dek">{{ .Params.description }}</p></div>
    <img src="{{ "images/portfolio/creative-abstract.svg" | relURL }}" width="640" height="480" alt="">
  </header>
  <div class="creative-prose prose">{{ .Content }}</div>
  <aside class="creative-next">
    <p class="eyebrow">Read on this site</p><h2>Two poems, unchanged.</h2>
    <a href="{{ "/poems/jirno-sriti/" | relURL }}" lang="bn">জীর্ণ স্মৃতি <span aria-hidden="true">→</span></a>
    <a href="{{ "/poems/bedonar-rong/" | relURL }}" lang="bn">বেদনার রঙ <span aria-hidden="true">→</span></a>
  </aside>
</section>
{{ end }}
